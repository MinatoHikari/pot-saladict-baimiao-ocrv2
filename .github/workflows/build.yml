name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Package .potext
        run: python build.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: potext
          path: dist/*.potext
      - name: Release on tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags')
        with:
          files: dist/*.potext
